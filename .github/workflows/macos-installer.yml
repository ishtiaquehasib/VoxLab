# VoxLab macOS installer — built on GitHub Actions macos-latest.
# Same shape as windows-installer.yml: Python 3.12, PyInstaller,
# app/ static files bundled as data, model files NOT bundled (they
# download on first run, as documented in README.md). No local build:
# the local VM cannot produce macOS binaries.
# Builds both Apple Silicon (macos-14, arm64) and Intel (macos-13,
# x64) runners, matching the website's download cards.
#
# Honest status: workflow syntax is validated locally (see PARITY.md),
# but a real macos-latest run has NOT happened yet — it can only
# happen after the repo is published to GitHub, which is gated by the
# parent agent's release gate. Do not claim an installer exists until
# a real Actions run produces one.
name: macOS installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            label: VoxLab-macOS-ARM64
          - runner: macos-13
            arch: x64
            label: VoxLab-macOS-Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (setuptools/wheel)
        # v1.0.0 fix: macOS arm64 build failed at Install dependencies
        # exit 2 "Cannot import 'setuptools.build_meta'" because the
        # runner's pip had no setuptools build backend. Install it
        # explicitly BEFORE any requirements install.
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install chatterbox-compatible torch/numpy first
        # v1.0.3 fix: v1.0.2 macOS build failed at Install dependencies,
        # exit 1, "ResolutionImpossible". Root cause, verified on PyPI:
        # EVERY chatterbox-tts version pins torch==2.6.0 and
        # torchaudio==2.6.0 (0.1.4-0.1.6 also pin numpy<1.26.0; 0.1.7
        # allows numpy>=1.24,<2), while backend/requirements.txt asks
        # for torch>=2.8 and torchaudio>=2.8. A single
        # `pip install -r requirements.txt` can NEVER resolve that:
        # torch cannot be both >=2.8 and ==2.6. The v1.0.2 preinstalled
        # numpy 1.26.4 also violated the older chatterbox numpy<1.26
        # cap. Fix (workflow-only, requirements.txt untouched): install
        # the chatterbox-compatible trio FIRST as prebuilt cp312 wheels
        # (torch 2.6.0 and numpy 1.26.x both ship manylinux + macOS
        # arm64/x64 wheels), then install the rest of requirements.txt
        # with the torch/torchaudio/numpy lines filtered out, so pip's
        # resolver sees the already-satisfied pins and accepts
        # chatterbox-tts instead of failing. --only-binary=numpy is
        # kept so a numpy source build (the v1.0.1 failure) can never
        # be attempted again on Python 3.12. Applies to both matrix
        # runners (macos-14 arm64, macos-13 x64).
        run: |
          python -m pip install "torch==2.6.0" "torchaudio==2.6.0" "numpy>=1.24,<2"

      - name: Install dependencies
        run: |
          grep -v -E '^(torch|torchaudio|numpy)([>=<]|$)' backend/requirements.txt > /tmp/requirements-filtered.txt
          pip install --only-binary=numpy -r /tmp/requirements-filtered.txt
          pip install pyinstaller

      - name: Verify faster-whisper installed (dictate/QC gate)
        # 2026-10-27 fix: frozen builds shipped without faster-whisper,
        # so Dictate/QC always failed with "No module named
        # 'faster_whisper'". Fail here, before PyInstaller, if it is
        # missing — do not hand PyInstaller a broken environment again.
        run: |
          python -c "import faster_whisper, ctranslate2; print('faster_whisper importable for frozen dictate/QC')"

      - name: Build with PyInstaller
        # Entry point is backend/desktop.py (native window), NOT
        # backend/server.py: desktop.py starts the FastAPI server
        # in a thread and opens a pywebview (WKWebView) window on
        # it — no browser tab. HONEST macOS LIMIT: this is still a
        # bare folder binary, NOT a --windowed .app bundle, so
        # double-clicking it directly may still show a terminal;
        # a true .app (windowed + Info.plist) is a separate, unbuilt
        # item (see the .dmg step comment). Model files are NOT
        # bundled (hundreds of MB, download on first run).
        run: |
          pyinstaller --noconfirm --clean --name VoxLab \
            --add-data "app:app" \
            --add-data "assets/voxlab-logo.png:assets" \
            --add-data "assets/voxlab-favicon.png:assets" \
            --add-data "backend/parler_worker.py:backend" \
            --collect-all imageio_ffmpeg \
            --collect-all edge_tts \
            --collect-all pywebview \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all tokenizers \
            --collect-all av \
            --collect-all certifi \
            --hidden-import edge_tts \
            --hidden-import aiohttp \
            --hidden-import edge_tts.communicate \
            --hidden-import edge_tts.data_classes \
            --hidden-import webview \
            --hidden-import webview.platforms.cocoa \
            backend/desktop.py

      - name: Smoke test built app (CI runtime check)
        # Real OS runtime check, not a simulation: start the ACTUAL
        # PyInstaller-built binary from dist/, wait for it to serve,
        # then require GET /api/voices -> 200 with exactly 19 voices
        # and GET / -> 200. Any failure fails this job BEFORE the
        # package is uploaded/attached, so a broken exe (e.g. the
        # v1.0.5 case: missing fastapi/uvicorn, or a bad frozen
        # StaticFiles path) can never again ship as a "successful"
        # build. The server is always killed afterwards (trap).
        # NOTE: this proves the server starts on THIS runner OS, not
        # a user double-clicking on their own desktop — but it is a
        # real OS run of the real binary, not a path simulation.
        # v1.0.9 fix (v1.0.8 Linux/macOS failure, run #10): the old
        # smoke step used python3 -c with an f-string in DOUBLE
        # quotes nested inside the -c DOUBLE quotes:
        #   python3 -c "... print(f"bengali: ...") ..."
        # Bash ends the -c argument at f", so Python received
        # "print(fbengali:" -> SyntaxError: invalid syntax, and
        # bash -e (GitHub's default) exited the step at once, the
        # EXIT trap killed the server, and the .deb/.dmg steps were
        # skipped. The server itself was NOT crashing: /api/voices
        # had already answered 19 voices / 8 Bengali. Windows was
        # unaffected (PowerShell ConvertFrom-Json, no such quoting).
        # Fix: NO python3 -c one-liners at all. All checks are
        # python3 heredocs (<<'PY', quoted delimiter = no shell
        # interpolation, no nested-quote hazard), each endpoint is
        # retried up to 30 s, and the script does NOT exit on the
        # first failure (set +e + FAIL flag): the server stays alive
        # through ALL checks, and only at the end, on failure, are
        # smoke.log + all fetched JSON files printed before exit 1.
        # Desktop entry on CI: VOXLAB_DESKTOP_NO_GUI=1 (server
        # thread only, no pywebview window — runners have no
        # guaranteed interactive desktop; window creation is
        # proven only by a real user-PC run, see desktop.py).
        run: |
          export VOXLAB_DESKTOP_NO_GUI=1
          ./dist/VoxLab/VoxLab > smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill $SMOKE_PID 2>/dev/null || true' EXIT
          FAIL=0
          fail() { echo "SMOKE FAIL: $*"; FAIL=1; }
          wait_for() {
            local url="$1" out="$2" up=0
            for i in $(seq 1 15); do
              if curl -fsS "$url" -o "$out"; then up=1; break; fi
              sleep 2
            done
            if [ "$up" != "1" ]; then fail "no answer from $url within 30s"; fi
          }
          wait_for http://127.0.0.1:8000/api/voices /tmp/voices.json
          curl -fsS http://127.0.0.1:8000/ -o /dev/null || fail "GET / failed"
          wait_for http://127.0.0.1:8000/api/bengali-status /tmp/bengali.json
          wait_for http://127.0.0.1:8000/api/parity/status /tmp/parity.json
          if [ -s /tmp/voices.json ]; then
            python3 - <<'PY' || FAIL=1
          import json, sys
          d = json.load(open('/tmp/voices.json'))
          n = len(d['voices'])
          bn = sum(1 for v in d['voices'] if v.get('lang') == 'bn')
          print('voices:', n, 'bengali:', bn)
          if n != 19 or bn != 8:
              print('SMOKE FAIL: expected 19 voices / 8 Bengali')
              sys.exit(1)
          PY
          else
            fail "/tmp/voices.json missing or empty"
          fi
          if [ -s /tmp/bengali.json ]; then
            python3 - <<'PY' || FAIL=1
          import json, sys
          d = json.load(open('/tmp/bengali.json'))
          print('bengali:', d['bn_count'], 'edge_tts:', d['edge_tts_installed'], 'guaranteed:', d['guaranteed_edge'])
          if d['bn_count'] != 8 or not d['edge_tts_installed']:
              print('SMOKE FAIL: expected bn_count 8 and edge_tts installed')
              sys.exit(1)
          PY
          else
            fail "/tmp/bengali.json missing or empty"
          fi
          if grep -q "parity routes disabled" smoke.log; then
            fail "parity routes disabled in built server"
          fi
          if [ "$FAIL" != "0" ]; then
            echo "--- smoke.log ---"; cat smoke.log
            echo "--- /tmp/voices.json ---"; cat /tmp/voices.json 2>/dev/null || echo "(missing)"
            echo "--- /tmp/bengali.json ---"; cat /tmp/bengali.json 2>/dev/null || echo "(missing)"
            echo "--- /tmp/parity.json ---"; cat /tmp/parity.json 2>/dev/null || echo "(missing)"
            exit 1
          fi
          echo "Smoke test passed: /api/voices 200 with 19 voices (8 Bengali), / 200, /api/parity/status 200, /api/bengali-status 200 with edge_tts importable"
          kill $SMOKE_PID 2>/dev/null || true
          trap - EXIT
      - name: Package installer folder
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/VoxLab ${{ matrix.label }}.zip

      - name: Build disk image (.dmg)
        # HONEST LIMIT, read before claiming a "macOS installer":
        # the PyInstaller build is a bare folder binary
        # (dist/VoxLab/VoxLab), NOT a macOS .app bundle, so this .dmg
        # is a disk image containing that same folder — it is NOT a
        # drag-to-Applications .app install, and it is unsigned, so
        # Gatekeeper will block/flag it on first run. A true .app
        # would need --windowed + a .app PyInstaller target, which
        # changes the smoke-test path and is a separate, unbuilt item.
        # The .dmg is still useful (single file, checksum, volume
        # name), and the zip stays as the primary download. Users
        # must copy the folder to a USER-WRITABLE location (e.g.
        # ~/Applications), NOT /Applications: server.py writes
        # <exe-dir>/output at startup and that fails under a
        # root-owned /Applications folder.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.0.0"; fi
          hdiutil create -volname "VoxLab $VERSION" -srcfolder dist/VoxLab -ov -format UDZO "${{ matrix.label }}.dmg"
          ls -lh "${{ matrix.label }}.dmg"

      - name: Check release size (parity with Linux)
        # GitHub release assets are capped at 2 GiB; Linux already
        # guards this, macOS did not — a >2 GiB macOS zip would fail
        # late at the attach step instead of here. 1.8 GiB guard.
        run: |
          SIZE=$(stat -f%z ${{ matrix.label }}.zip)
          echo "${{ matrix.label }}.zip bytes: $SIZE"
          if [ "$SIZE" -ge 1932735283 ]; then echo "ERROR: macOS package >= 1.8 GiB, would exceed GitHub release limits"; exit 1; fi

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.label }}.zip
            ${{ matrix.label }}.dmg

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.label }}.zip
            ${{ matrix.label }}.dmg
          body: |
            VoxLab — free local voice studio for PC.
            macOS build (${{ matrix.arch }}). Zip is the primary download;
            the .dmg is the same folder in a disk image (NOT a .app
            bundle — copy it to a user-writable folder, not /Applications).
            Unsigned, so Gatekeeper will flag it on first run.
            First run downloads the open models
            once, then VoxLab works offline on your PC.
            No account, no subscription. Clone only voices you own or
            have explicit permission to use.

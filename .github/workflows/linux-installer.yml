# VoxLab Linux installer — built on GitHub Actions ubuntu-latest.
# Same shape as windows-installer.yml: Python 3.12, PyInstaller,
# app/ static files bundled as data, model files NOT bundled (they
# download on first run, as documented in README.md). No local build
# is claimed: this workflow is the build route, as with Windows/macOS.
# The website lists Linux as "Build from source", and this workflow
# produces the same single-folder build as a downloadable archive.
#
# Honest status: workflow syntax is validated locally (see PARITY.md),
# but a real ubuntu-latest run has NOT happened yet — it can only
# happen after the repo is published to GitHub, which is gated by the
# parent agent's release gate. Do not claim an installer exists until
# a real Actions run produces one.
name: Linux installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (setuptools/wheel)
        # v1.0.0 fix: Linux build-linux failed at Install dependencies
        # exit 2 "Cannot import 'setuptools.build_meta'" because the
        # runner's pip had no setuptools build backend. Install it
        # explicitly BEFORE any requirements install.
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install chatterbox-compatible torch/numpy first
        # v1.0.3 fix: v1.0.2 Linux build failed at Install dependencies,
        # exit 1, "ResolutionImpossible". Root cause, verified on PyPI:
        # EVERY chatterbox-tts version pins torch==2.6.0 and
        # torchaudio==2.6.0 (0.1.4-0.1.6 also pin numpy<1.26.0; 0.1.7
        # allows numpy>=1.24,<2), while backend/requirements.txt asks
        # for torch>=2.8 and torchaudio>=2.8. A single
        # `pip install -r requirements.txt` can NEVER resolve that:
        # torch cannot be both >=2.8 and ==2.6. The v1.0.2 preinstalled
        # numpy 1.26.4 also violated the older chatterbox numpy<1.26
        # cap. Fix (workflow-only, requirements.txt untouched): install
        # the chatterbox-compatible trio FIRST as prebuilt cp312 wheels
        # (torch 2.6.0 and numpy 1.26.x both ship manylinux + macOS
        # arm64/x64 wheels), then install the rest of requirements.txt
        # with the torch/torchaudio/numpy lines filtered out, so pip's
        # resolver sees the already-satisfied pins and accepts
        # chatterbox-tts instead of failing. --only-binary=numpy is
        # kept so a numpy source build (the v1.0.1 failure) can never
        # be attempted again on Python 3.12.
        # v1.0.4 fix (THIS step changed): torch/torchaudio are now
        # installed from the PyTorch CPU index, NOT default PyPI.
        # Default PyPI's Linux torch 2.6.0 wheel is CUDA-enabled and
        # unpacks to ~2.5 GB of GPU libraries (libtorch_cuda,
        # cuDNN/cuBLAS, NCCL, nvidia/* packages) that PyInstaller
        # then bundles into dist/VoxLab — that is why the v1.0.3
        # Linux artifact was 3.13 GB and exceeded GitHub's 2 GiB
        # release-asset limit, while the macOS artifact (CPU-only
        # torch wheel, no CUDA libs) was only 253 MB. VoxLab runs
        # all engines on CPU (Kokoro ONNX, Chatterbox, Parler and
        # Whisper are all CPU-tested; no GPU is required or
        # documented), so a CPU-only Linux build is honest and
        # matches the macOS build. numpy is installed separately
        # from default PyPI because the CPU index does not host it.
        # chatterbox-tts still sees torch==2.6.0 satisfied, so it
        # does NOT reinstall the CUDA wheel in the next step.
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchaudio==2.6.0"
          python -m pip install "numpy>=1.24,<2"

      - name: Install dependencies
        run: |
          grep -v -E '^(torch|torchaudio|numpy)([>=<]|$)' backend/requirements.txt > /tmp/requirements-filtered.txt
          pip install --only-binary=numpy -r /tmp/requirements-filtered.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        # Entry point is backend/server.py; the app/ static files are
        # bundled as data so the single-folder build serves the UI.
        # Model files are NOT bundled (they are hundreds of MB and
        # download on first run, as documented in README.md).
        run: |
          pyinstaller --noconfirm --clean --name VoxLab \
            --add-data "app:app" \
            --add-data "assets/voxlab-logo.png:assets" \
            --collect-all imageio_ffmpeg \
            --collect-all edge_tts \
            --hidden-import edge_tts \
            --hidden-import aiohttp \
            --hidden-import edge_tts.communicate \
            --hidden-import edge_tts.data_classes \
            backend/server.py

      - name: Slim packaged folder (v1.0.4)
        # Belt-and-braces after the CPU-torch fix: delete files
        # PyInstaller bundles that VoxLab never executes at runtime
        # (bytecode caches, torch test suites and C++ headers, and
        # any CUDA/nvidia leftovers if a dependency reintroduced
        # them). Every deletion is guarded (|| true / find patterns
        # that match nothing safely) so this step cannot fail the
        # build when a path is already absent. Sizes are printed
        # before/after so the Actions log proves the slimming.
        # NOT deleted: any .so/.py runtime module, model files
        # (none are bundled anyway), app/ data, or the logo.
        run: |
          echo "--- dist size before slimming ---"
          du -sh dist/VoxLab
          find dist/VoxLab -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find dist/VoxLab -type f -name "*.pyc" -delete 2>/dev/null || true
          find dist/VoxLab -path "*torch/test*" -exec rm -rf {} + 2>/dev/null || true
          find dist/VoxLab -path "*torch/testing*" -exec rm -rf {} + 2>/dev/null || true
          find dist/VoxLab -type d -name "include" -path "*torch*" -exec rm -rf {} + 2>/dev/null || true
          find dist/VoxLab -type d -name "share" -path "*torch*" -exec rm -rf {} + 2>/dev/null || true
          find dist/VoxLab -name "libtorch_cuda*" -delete 2>/dev/null || true
          find dist/VoxLab -name "libcudnn*" -delete 2>/dev/null || true
          find dist/VoxLab -name "libnccl*" -delete 2>/dev/null || true
          find dist/VoxLab -type d -name "nvidia" -exec rm -rf {} + 2>/dev/null || true
          find dist/VoxLab -type f -name "*.pyi" -delete 2>/dev/null || true
          echo "--- dist size after slimming ---"
          du -sh dist/VoxLab

      - name: Smoke test built app (CI runtime check)
        # Real OS runtime check, not a simulation: start the ACTUAL
        # PyInstaller-built binary from dist/, wait for it to serve,
        # then require GET /api/voices -> 200 with exactly 19 voices
        # and GET / -> 200. Any failure fails this job BEFORE the
        # package is uploaded/attached, so a broken exe (e.g. the
        # v1.0.5 case: missing fastapi/uvicorn, or a bad frozen
        # StaticFiles path) can never again ship as a "successful"
        # build. The server is always killed afterwards (trap).
        # NOTE: this proves the server starts on THIS runner OS, not
        # a user double-clicking on their own desktop — but it is a
        # real OS run of the real binary, not a path simulation.
        run: |
          set -e
          ./dist/VoxLab/VoxLab > smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill $SMOKE_PID 2>/dev/null || true' EXIT
          UP=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/voices > /tmp/voices.json; then UP=1; break; fi
            sleep 2
          done
          if [ "$UP" != "1" ]; then echo "ERROR: built server did not answer /api/voices within 60s"; cat smoke.log; exit 1; fi
          curl -fsS http://127.0.0.1:8000/ -o /dev/null
          python3 -c "import json, sys; d = json.load(open('/tmp/voices.json')); n = len(d['voices']); bn = sum(1 for v in d['voices'] if v.get('lang') == 'bn'); print(f'voices: {n}, bengali: {bn}'); sys.exit(0 if n == 19 and bn == 8 else 1)"
          # Bengali frozen check (no network generate in CI): exactly 8 bn
          # voices AND edge_tts importable in the built server, so a
          # lazy-import miss can never ship as a Bengali 500 again.
          curl -fsS http://127.0.0.1:8000/api/bengali-status > /tmp/bengali.json
          python3 -c "import json, sys; d = json.load(open('/tmp/bengali.json')); print(f"bengali: {d['bn_count']}, edge_tts: {d['edge_tts_installed']}, guaranteed: {d['guaranteed_edge']}"); sys.exit(0 if d['bn_count'] == 8 and d['edge_tts_installed'] else 1)"
          # Parity routes are OPTIONAL in server.py (try/except): a build
          # whose parity.py fails to import still serves / and
          # /api/voices 200, so those two checks alone would let a
          # parity-broken build attach. Require the parity status
          # route AND reject the disabled-routes log line.
          curl -fsS http://127.0.0.1:8000/api/parity/status -o /dev/null
          if grep -q "parity routes disabled" smoke.log; then echo "ERROR: parity routes disabled in built server"; cat smoke.log; exit 1; fi
          echo "Smoke test passed: /api/voices 200 with 19 voices (8 Bengali), / 200, /api/parity/status 200, /api/bengali-status 200 with edge_tts importable"
          kill $SMOKE_PID 2>/dev/null || true
          trap - EXIT

      - name: Build .deb package
        # REAL LINUX INSTALLER (dpkg-deb, no extra tool needed):
        # installs to /opt/voxlab, adds /usr/bin/voxlab and a desktop
        # entry (installer/voxlab.desktop). Runs AFTER the smoke test
        # and uses a COPY of the slimmed dist folder, so the tar.gz
        # below is unaffected. Two honest limits: (1) the .deb is
        # unsigned and unmaintained-repo-local — install with
        # `sudo dpkg -i`, no apt repo; (2) server.py writes
        # <exe-dir>/output at startup, and /opt/voxlab is root-owned,
        # so postinst creates /opt/voxlab/output mode 777 (that one
        # directory only, not the whole app) or a normal user could
        # not generate after install. An AppImage was considered and
        # DEFERRED: it needs appimagetool + a FUSE runtime and its
        # own smoke test, and adds a second untested packaging path
        # for no user-facing gain over .deb + tar.gz.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.0.0"; fi
          echo "deb version: $VERSION"
          rm -rf voxlab-deb
          mkdir -p voxlab-deb/opt/voxlab voxlab-deb/usr/bin voxlab-deb/usr/share/applications voxlab-deb/DEBIAN
          cp -a dist/VoxLab/. voxlab-deb/opt/voxlab/
          cp assets/voxlab-logo.png voxlab-deb/opt/voxlab/voxlab-logo.png
          cp installer/voxlab.desktop voxlab-deb/usr/share/applications/voxlab.desktop
          printf '#!/bin/sh\nexec /opt/voxlab/VoxLab "$@"\n' > voxlab-deb/usr/bin/voxlab
          chmod 755 voxlab-deb/usr/bin/voxlab
          cat > voxlab-deb/DEBIAN/control <<EOF
          Package: voxlab
          Version: $VERSION
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: Ishtiaque Hasib
          Description: VoxLab — free local voice studio
           Clone, generate and create with open models, free and local
           on your own PC. No account, no subscription.
          EOF
          cat > voxlab-deb/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /opt/voxlab/output
          chmod 777 /opt/voxlab/output || true
          EOF
          chmod 755 voxlab-deb/DEBIAN/postinst
          # dpkg-deb rejects a DEBIAN dir whose mode is outside
          # 0755-0775 (a restrictive umask can produce 0700/0770 and
          # fail the build here, not at install time) — force it.
          chmod 755 voxlab-deb/DEBIAN
          dpkg-deb --build voxlab-deb "VoxLab-Linux-amd64-$VERSION.deb"
          ls -lh "VoxLab-Linux-amd64-$VERSION.deb"
          echo "VOXLAB_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package installer folder
        run: |
          tar -czf VoxLab-Linux-x64.tar.gz -C dist VoxLab
          ls -lh VoxLab-Linux-x64.tar.gz

      - name: Check release size (v1.0.4)
        # GitHub release assets are capped at 2 GiB; fail here with
        # a clear message instead of failing later at the attach
        # step (the v1.0.3 symptom). 1.8 GiB guard leaves headroom.
        run: |
          SIZE=$(stat -c%s VoxLab-Linux-x64.tar.gz)
          echo "VoxLab-Linux-x64.tar.gz bytes: $SIZE"
          if [ "$SIZE" -ge 1932735283 ]; then echo "ERROR: Linux package >= 1.8 GiB, would exceed GitHub release limits"; exit 1; fi
          DEB="VoxLab-Linux-amd64-${VOXLAB_VERSION}.deb"
          DSIZE=$(stat -c%s "$DEB")
          echo "$DEB bytes: $DSIZE"
          if [ "$DSIZE" -ge 1932735283 ]; then echo "ERROR: Linux .deb >= 1.8 GiB, would exceed GitHub release limits"; exit 1; fi

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: VoxLab-Linux-x64
          path: |
            VoxLab-Linux-x64.tar.gz
            VoxLab-Linux-amd64-${{ env.VOXLAB_VERSION }}.deb

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VoxLab-Linux-x64.tar.gz
            VoxLab-Linux-amd64-${{ env.VOXLAB_VERSION }}.deb
          body: |
            VoxLab — free local voice studio for PC.
            Linux 64-bit build, CPU-only (no GPU required).
            RECOMMENDED: the .deb (sudo dpkg -i) installs to /opt/voxlab
            with a launcher and desktop entry; the tar.gz is the
            portable fallback.
            First run downloads the open models
            once, then VoxLab works offline on your PC.
            No account, no subscription. Clone only voices you own or
            have explicit permission to use.

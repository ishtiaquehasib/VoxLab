# VoxLab Windows installer — built on GitHub Actions windows-latest.
# No wine, no local Windows build: the local VM cannot reliably build
# Windows NSIS installers (see AGENTS.md lesson in the main workspace).
# This workflow builds with PyInstaller on windows-latest and uploads
# the installer as a Release artifact. It does NOT publish a release
# by itself: it runs on a version tag (v*), and the release is created
# by the workflow's softprops/action-gh-release step only for that tag.
# Manual dispatch is also allowed so a maintainer can test a build
# without cutting a release (upload-artifact only in that case).
#
# Honest status: workflow syntax is validated locally (see PARITY.md),
# but a real windows-latest run has NOT happened yet — it can only
# happen after the repo is published to GitHub, which is gated by the
# parent agent's release gate. Do not claim an installer exists until
# a real Actions run produces one.
name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (setuptools/wheel)
        # Windows run #7 root cause, part 2: pip install -r
        # backend/requirements.txt FAILED with "Cannot import
        # setuptools.build_meta" and NO "Successfully installed" line,
        # so fastapi/uvicorn/torch/kokoro were never installed and
        # PyInstaller still "succeeded" with a broken 11 MB exe.
        # Never let a silent pip failure produce an exe again: build
        # tools first, then a verify step below that imports the
        # server deps and fails the job if they are missing.
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install chatterbox-compatible torch/numpy first
        # Same approach as linux/macOS: EVERY chatterbox-tts version
        # pins torch==2.6.0 / torchaudio==2.6.0, while requirements.txt
        # asks torch>=2.8 — a single pip install can never resolve
        # that, and pip backtracked numpy to a 1.25.2 source tarball.
        # Pre-install the compatible pins, then install the filtered
        # requirements (torch/torchaudio/numpy lines removed) so pip
        # sees them already satisfied instead of backtracking.
        run: |
          python -m pip install "torch==2.6.0" "torchaudio==2.6.0" "numpy>=1.24,<2"
          python -c "import re; lines=open('backend/requirements.txt').read().splitlines(); open('requirements-filtered.txt','w').write(chr(10).join(l for l in lines if not re.match(r'^(torch|torchaudio|numpy)([>=<]|$)', l.strip()))+chr(10))"
          type requirements-filtered.txt

      - name: Install dependencies
        run: |
          pip install --only-binary=numpy -r requirements-filtered.txt
          pip install pyinstaller

      - name: Verify server dependencies installed
        # Hard gate: if fastapi/uvicorn are missing, FAIL here —
        # do not hand PyInstaller a broken environment again.
        run: |
          python -c "import fastapi, uvicorn, sys; print('fastapi', fastapi.__version__); print('uvicorn ok')"
          python -c "import edge_tts; print('edge_tts importable for frozen Bengali build')"
          python -c "import webview; print('pywebview', webview.__version__)"
          python -c "import faster_whisper, ctranslate2; print('faster_whisper importable for frozen dictate/QC')"
          python -c "import certifi; print('certifi bundle for frozen HF downloads:', certifi.where())"
          pip show torch torchaudio numpy

      - name: Build with PyInstaller
        # Entry point is backend/desktop.py (native window), NOT
        # backend/server.py: desktop.py starts the FastAPI server
        # in a thread and opens a pywebview window on it — no
        # browser tab, no terminal. --noconsole is what makes the
        # exe windowed on Windows (no console window at launch);
        # the window/taskbar icon comes from --icon below, since
        # pywebview create_window takes no icon argument.
        # Model files are NOT bundled (they are hundreds of MB and
        # download on first run, as documented in README.md).
        run: |
          pyinstaller --noconfirm --clean --name VoxLab `
            --noconsole `
            --icon "assets/voxlab-logo.ico" `
            --add-data "app;app" `
            --add-data "assets/voxlab-logo.png;assets" `
            --add-data "assets/voxlab-favicon.png;assets" `
            --add-data "backend/parler_worker.py;backend" `
            --collect-all imageio_ffmpeg `
            --collect-all edge_tts `
            --collect-all pywebview `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all av `
            --collect-all certifi `
            --hidden-import edge_tts `
            --hidden-import aiohttp `
            --hidden-import edge_tts.communicate `
            --hidden-import edge_tts.data_classes `
            --hidden-import webview `
            --hidden-import webview.platforms.edgechromium `
            backend/desktop.py

      - name: Verify windowed build (no console)
        # --noconsole sets the PE subsystem to Windows GUI (2),
        # not console (3). Check the built exe's PE header with
        # stdlib only — a console-subsystem exe would open a
        # terminal window on double-click, which is the bug this
        # desktop entry exists to fix. (Also proves the exe exists
        # before the smoke step runs it.)
        shell: pwsh
        run: |
          python -c "import struct, sys; d=open('dist\\VoxLab\\VoxLab.exe','rb').read(); pe=struct.unpack_from('<I', d, 0x3c)[0]; assert d[pe:pe+4]==b'PE\0\0', 'not a PE file'; sub=struct.unpack_from('<H', d, pe+4+20+68)[0]; print('PE subsystem:', sub); sys.exit(0 if sub==2 else 1)"

      - name: Smoke test built app (CI runtime check)
        # Real OS runtime check, not a simulation: start the ACTUAL
        # PyInstaller-built VoxLab.exe from dist/, wait for it to
        # serve, then require GET /api/voices -> 200 with exactly 19
        # voices and GET / -> 200. Any failure (including the exe
        # exiting early) fails this job BEFORE the package is
        # uploaded/attached, so a broken exe (e.g. the v1.0.5 case:
        # missing fastapi/uvicorn, or a bad frozen StaticFiles path)
        # can never again ship as a "successful" build. The server
        # process is always stopped afterwards (finally block).
        # NOTE: this proves the server starts on THIS runner OS, not
        # a user double-clicking on their own desktop — but it is a
        # real OS run of the real binary, not a path simulation.
        # The exe is now the DESKTOP entry (backend/desktop.py):
        # on a CI runner there is no guaranteed interactive desktop
        # session for a pywebview window, so smoke runs it with
        # VOXLAB_DESKTOP_NO_GUI=1 (server thread only, no window —
        # see desktop.py). That proves the desktop entry starts a
        # working server; window creation itself is proven only by
        # a real user-PC run, and is NOT claimed from this smoke.
        shell: pwsh
        run: |
          $env:VOXLAB_DESKTOP_NO_GUI = "1"
          $proc = Start-Process -FilePath "dist\VoxLab\VoxLab.exe" -RedirectStandardOutput smoke.log -RedirectStandardError smoke-err.log -PassThru
          try {
            $up = $false
            $r = $null
            for ($i = 0; $i -lt 30; $i++) {
              if ($proc.HasExited) { throw "VoxLab.exe exited early with code $($proc.ExitCode)" }
              try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/voices" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $up = $true; break } } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $up) { throw "Built server did not answer /api/voices within 60s" }
            $count = ($r.Content | ConvertFrom-Json).voices.Count
            if ($count -ne 19) { throw "Expected 19 voices, got $count" }
            $bnCount = (($r.Content | ConvertFrom-Json).voices | Where-Object { $_.lang -eq 'bn' }).Count
            if ($bnCount -ne 8) { throw "Expected 8 Bengali voices, got $bnCount" }
            $bn = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/bengali-status" -UseBasicParsing -TimeoutSec 10
            if ($bn.StatusCode -ne 200) { throw "Bengali status $($bn.StatusCode)" }
            $bnJson = ($bn.Content | ConvertFrom-Json)
            if (-not $bnJson.edge_tts_installed) { throw "edge_tts not importable in frozen build — Bengali Edge would 500" }
            if ($bnJson.bn_count -ne 8) { throw "Bengali status bn_count $($bnJson.bn_count), expected 8" }
            Write-Host "Bengali smoke passed: 8 bn voices, edge_tts importable, guaranteed Edge: $($bnJson.guaranteed_edge -join ',')"
            $homePage = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 10
            if ($homePage.StatusCode -ne 200) { throw "Homepage status $($homePage.StatusCode)" }
            # Parity bypass check (same as Linux/macOS): server.py loads
            # parity routes inside try/except, so / and /api/voices 200
            # alone would let a parity-broken build ship. Require the
            # parity status route AND reject the disabled-routes log.
            $parityPage = Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/parity/status" -UseBasicParsing -TimeoutSec 10
            if ($parityPage.StatusCode -ne 200) { throw "Parity status $($parityPage.StatusCode)" }
            foreach ($logFile in @("smoke.log", "smoke-err.log")) {
              if ((Test-Path $logFile) -and (Select-String -Path $logFile -Pattern "parity routes disabled" -Quiet)) { throw "Parity routes disabled in built server ($logFile)" }
            }
            Write-Host "Smoke test passed: /api/voices 200 with 19 voices (8 Bengali), / 200, /api/parity/status 200, /api/bengali-status 200 with edge_tts importable"
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Derive version from tag
        # Tag vX.Y.Z -> X.Y.Z for the installer metadata; a manual
        # dispatch (no tag) gets 0.0.0 so it is never mistaken for a
        # release build. Inno Setup needs a dotted version, and the
        # .iss script defaults to 0.0.0 without /DMyAppVersion.
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME
          if ($ver -match '^v(.+)$') { $ver = $Matches[1] } else { $ver = '0.0.0' }
          "VOXLAB_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Installer version: $ver"

      - name: Build real installer (Inno Setup)
        # REAL INSTALLER, not a zip: this is the step the zip-only
        # releases lacked. Inno Setup (not WiX/MSI) — see the header
        # of installer/voxlab.iss for why: a WiX MSI would need a
        # heat-harvested component per file in the PyInstaller folder
        # (thousands of files), while Inno takes the folder recursively
        # and still gives a wizard, Start Menu + desktop shortcuts,
        # and a Settings > Apps uninstall entry. Output is an .exe
        # installer, NOT an .msi — never rename it to .msi.
        # Runs AFTER the smoke test, so a broken exe can never be
        # packaged into an installer. The zip is kept below as a
        # portable fallback until the installer is proven on a real
        # user PC; the installer is the recommended download.
        # Unsigned: no code-signing certificate (zero-cost rule), so
        # SmartScreen will warn on first run — that is expected.
        shell: pwsh
        run: |
          choco install innosetup -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer\voxlab.iss" "/DMyAppVersion=$env:VOXLAB_VERSION"
          if (-not (Test-Path "installer-output\VoxLab-Setup-x64.exe")) { throw "Installer output missing" }
          Copy-Item "installer-output\VoxLab-Setup-x64.exe" -Destination "VoxLab-Setup-$env:VOXLAB_VERSION-x64.exe"
          Get-Item "VoxLab-Setup-$env:VOXLAB_VERSION-x64.exe" | Select-Object Name, Length

      - name: Check installer size
        # GitHub release assets are capped at 2 GiB; the installer
        # (LZMA2 solid) should be close to the zip size, not larger.
        # v1.0.6 zip was 325 MB, so a sane installer is ~300-360 MB.
        # Fail here, not at attach, if it ever balloons past 1.8 GiB.
        shell: pwsh
        run: |
          $size = (Get-Item "VoxLab-Setup-$env:VOXLAB_VERSION-x64.exe").Length
          Write-Host "Installer bytes: $size"
          if ($size -ge 1932735283) { throw "Installer >= 1.8 GiB, would exceed GitHub release limits" }

      - name: Package installer folder
        run: |
          Compress-Archive -Path dist/VoxLab -DestinationPath VoxLab-Windows-x64.zip

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: VoxLab-Windows-x64
          path: |
            VoxLab-Windows-x64.zip
            VoxLab-Setup-${{ env.VOXLAB_VERSION }}-x64.exe

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VoxLab-Windows-x64.zip
            VoxLab-Setup-${{ env.VOXLAB_VERSION }}-x64.exe
          body: |
            VoxLab — free local voice studio for PC.
            Windows 64-bit build. RECOMMENDED: VoxLab-Setup-x64.exe —
            a real installer (wizard, Start Menu + desktop shortcuts,
            Settings > Apps uninstall). It is an Inno Setup .exe
            installer, NOT an .msi file. VoxLab-Windows-x64.zip is the
            portable fallback (extract and run VoxLab.exe).
            Per-user install to %LOCALAPPDATA%\VoxLab, no admin needed.
            Unsigned, so SmartScreen will warn on first run.
            First run downloads the open models once, then VoxLab
            works offline on your PC.
            No account, no subscription. Clone only voices you own or
            have explicit permission to use.
